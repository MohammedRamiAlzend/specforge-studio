services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      AUTH_REQUIRED: "true"
      AUTH_RATE_LIMIT_ENABLED: "true"
      COOKIE_SECURE: "false"
      PORT: "3000"
      HOST: 0.0.0.0
      DATABASE_PATH: /app/data/specforge.db
      EXPORT_DIR: /app/data/exports
      BACKUP_STATUS_FILE: /app/backups/last-backup.json
    volumes:
      - specforge_data:/app/data
      - ./backups:/app/backups
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/healthz').then((r) => { if (!r.ok) process.exit(1) })"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  specforge_data:
